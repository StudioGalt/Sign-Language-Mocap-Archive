# Publishes the sign gallery to GitHub Pages on every push to main, and again once a
# release's download packs are built, so each sign lists the packs that hold it.
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
# Only small text files and the preview videos (for thumbnails) are downloaded;
# videos and FBX files are linked straight from the repository.
name: Publish gallery

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Build download packs"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/
            /site/
            /SG ASL Dictionary/**/*.txt
            /SG ASL Fingerspelling/**/*.txt

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Thumbnails are kept between runs, so only new signs are processed.
      - uses: actions/cache@v6
        with:
          path: .thumbs
          key: thumbs-${{ github.run_id }}
          restore-keys: thumbs-

      - name: Make thumbnails
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg)
          python tools/build_thumbs.py

      - name: Build gallery
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/build_site.py --repo "${{ github.repository }}" --branch "${{ github.event.repository.default_branch }}" --release latest

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true  # keeps .nojekyll

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
