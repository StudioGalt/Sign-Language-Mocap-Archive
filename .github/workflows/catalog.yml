# Rebuilds catalog/ whenever new motions are pushed to main.
# Only the small text files are downloaded, so this runs in well under a minute
# even though the archive itself is very large.
name: Update catalog

on:
  push:
    branches: [main]
    paths-ignore:
      - "catalog/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/
            /catalog/
            /SG ASL Dictionary/**/*.txt
            /SG ASL Fingerspelling/**/*.txt

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build catalog
        run: python tools/build_catalog.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog
          if git diff --cached --quiet; then
            echo "Catalog already up to date."
          else
            git commit -m "Update catalog"
            git push
          fi
